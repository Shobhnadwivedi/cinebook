<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CineBook — Book movie tickets</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">CineBook</a>
    <div class="userbox" id="userbox"></div>
  </header>
  <main>
    <h1>Now showing</h1>
    <p class="lede">Pick a showtime to choose your seats. We hold your seats for 8 minutes while you pay.</p>
    <p class="notice error hidden" id="error"></p>
    <div id="movies">Loading shows…</div>
  </main>
  <dialog id="signin">
    <form>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-mode="login">Sign in</button>
        <button type="button" role="tab" data-mode="signup">Create account</button>
      </div>
      <p class="notice error hidden"></p>
      <div class="name-row hidden">
        <label for="fullname">Name</label>
        <input id="fullname" name="fullname" autocomplete="name" maxlength="60">
      </div>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">Password (8 or more characters)</label>
      <input id="password" name="password" type="password" minlength="8" required>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" data-cancel>Cancel</button>
        <button class="btn" data-submit>Sign in</button>
      </div>
    </form>
  </dialog>
  <script src="/app.js"></script>
  <script src="/home.js"></script>
</body>
</html>
