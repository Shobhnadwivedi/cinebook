<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — CineBook</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">CineBook</a>
    <div class="userbox" id="userbox"></div>
  </header>
  <main>
    <h1>Admin</h1>
    <p class="notice hidden" id="msg" aria-live="polite"></p>

    <form id="unlock" class="panel" style="max-width:420px">
      <label for="adminpw">Admin password</label>
      <input id="adminpw" type="password" autocomplete="current-password" required>
      <button class="btn">Open admin</button>
    </form>

    <div id="admin" class="hidden">
      <div class="admin-grid">
        <form class="panel" id="showForm">
          <h2>Add a show</h2>
          <label for="s-movie">Movie</label><select id="s-movie" name="movieId" required></select>
          <label for="s-theatre">Theatre</label><select id="s-theatre" name="theatreId" required></select>
          <label for="s-time">Date and time</label><input id="s-time" name="time" type="datetime-local" required>
          <div class="two">
            <div><label for="s-base">Regular price (₹)</label><input id="s-base" name="basePrice" type="number" min="1" value="180" required></div>
            <div><label for="s-prem">Premium price (₹)</label><input id="s-prem" name="premiumPrice" type="number" min="1" value="280" required></div>
          </div>
          <button class="btn">Add show</button>
        </form>

        <form class="panel" id="movieForm">
          <h2>Add a movie</h2>
          <label for="m-title">Title</label><input id="m-title" name="title" required maxlength="100">
          <div class="two">
            <div><label for="m-lang">Language</label><input id="m-lang" name="language" required value="Hindi"></div>
            <div><label for="m-genre">Genre</label><input id="m-genre" name="genre" required value="Drama"></div>
          </div>
          <div class="two">
            <div><label for="m-dur">Length (minutes)</label><input id="m-dur" name="durationMin" type="number" min="30" max="300" value="140" required></div>
            <div><label for="m-cert">Certificate</label>
              <select id="m-cert" name="certificate"><option>U</option><option selected>UA</option><option>A</option></select></div>
          </div>
          <button class="btn">Add movie</button>
        </form>

        <form class="panel" id="theatreForm">
          <h2>Add a theatre</h2>
          <label for="t-name">Name</label><input id="t-name" name="name" required>
          <label for="t-city">City</label><input id="t-city" name="city" required value="Jaipur">
          <div class="two">
            <div><label for="t-rows">Rows (max 26)</label><input id="t-rows" name="rows" type="number" min="1" max="26" value="10" required></div>
            <div><label for="t-cols">Seats per row</label><input id="t-cols" name="cols" type="number" min="1" max="40" value="14" required></div>
          </div>
          <label for="t-prem">Premium rows (at the back)</label><input id="t-prem" name="premiumRows" type="number" min="0" max="26" value="2" required>
          <button class="btn">Add theatre</button>
        </form>
      </div>

      <h2>Upcoming shows</h2>
      <div class="table-wrap"><table id="showsTable"></table></div>
      <h2>Recent paid bookings</h2>
      <div class="table-wrap"><table id="bookingsTable"></table></div>
    </div>
  </main>
  <script src="/app.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
